#应用服务 WEB 访问端口
server:
  port: 9090
#数据库配置
spring:
  application:
    name: testspringboot
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 
    url: jdbc:mysql://127.0.0.1:3306/test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
#  hikari:
#    maximum-pool-size: 20
#    minimum-idle: 5
#    idle-timeout: 30000
#    max-lifetime: 1800000
#    connection-timeout: 30000
  jpa:
    hibernate: ddl-auto:update
    show-sql: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379  # 端口号
      password: 
      database: 0  # 数据库索引（默认为0）
      timeout: 1800000  # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 20  # 连接池最大连接数（使用负值表示没有限制）
          max-wait: -1  # 最大阻塞等待时间（负数表示没有限制）
          max-idle: 5  # 连接池中最大空闲连接
          min-idle: 0  # 连接池中最小空闲连接
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      retries: 3
      retry:
        backoff:
          ms: 100
      enable:
        idempotence: true
      batch-size: 16384
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: tomge-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      default-topic: testtopic,testtopic2
    listener:
      ack-mode: manual_immediate
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:8b
    chat:
      client:
        enabled: true
#  mvc:
#    pathmatch:
#      matching-strategy: ant_path_matcher

dubbo:
  application:
    name: provider
  registry:
    address: zookeeper://127.0.0.1:2181
  protocol:
    name: dubbo
    port: 20880
  scan:
    base-packages: com.buddha.service

#mybatis依赖
mybatis:
  #MyBatis Configuration确保在 application.properties 或 application.yml 文件中指定了正确的映射文件路径
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  file:
    name: info.log
  level:
    com.test: info
    org.springframework: warn
  config: classpath:logback-spring.xml

springdoc:
  api-docs:
    enabled: true # 开启OpenApi接口
    path: /v3/api-docs  # 自定义路径，默认为 "/v3/api-docs"
  swagger-ui:
    enabled: true # 开启swagger界面，依赖OpenApi，需要OpenApi同时开启
    path: /swagger-ui.html # 自定义路径，默认为"/swagger-ui/index.html"
    # Packages to include,多个用 , 分割
    packagesToScan: com.test.testboot.controller

# 自定义配置
#migration: 1000
